# pnpm blocks dependency build scripts by default; the allow-list lives HERE (pnpm 11+ reads
# `allowBuilds` from pnpm-workspace.yaml — the package.json `pnpm` field is no longer read).
# better-sqlite3 must compile its native module and playwright must download Chromium, or the
# engine cannot run. Verified against pnpm 11.21.
allowBuilds:
  better-sqlite3: true
  playwright: true
